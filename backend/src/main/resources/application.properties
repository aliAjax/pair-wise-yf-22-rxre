server.port=8080
# 当前仓储层为内存实现，classpath 上的 JPA/MyBatis-Plus 自动装配在无数据源时会阻止启动，这里显式排除；
# 后续接入真实 PostgreSQL 时移除本行并配置 spring.datasource.* 即可。
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
